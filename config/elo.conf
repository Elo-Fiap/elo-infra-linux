# Configuração do provisionamento do Elo (Operating Systems, FIAP Global Solution 2026.2).
# Tudo que muda de uma VM para outra fica aqui: os scripts leem este arquivo e não precisam ser editados.
# Valor vazio = o script descobre sozinho na VM.
# Para testar outros valores sem mexer neste arquivo, crie config/elo.local.conf (fica fora do Git).

# ---------- Identidade e rede ----------
NOME_HOST="elo-srv"                 # hostname da VM
DOMINIO="elo-fiap.com"              # zona DNS que esta VM serve
INTERFACE=""                        # placa de rede (vazio: a da rota padrão)
IP_SERVIDOR=""                      # IP fixo (vazio: fixa o IP que a placa já tem)
PREFIXO=""                          # máscara em bits, por exemplo 24 (vazio: a atual)
GATEWAY=""                          # saída da rede (vazio: a atual)
CONFIGURAR_IP_FIXO="sim"            # "nao": não mexe no endereço da placa
DNS_EXTERNOS="8.8.8.8 1.1.1.1"      # para onde o BIND encaminha o que não é da zona
CONFIGURAR_FIREWALL="sim"           # "nao": não mexe no UFW

# ---------- Aplicação hospedada (API do Elo, da disciplina de C#) ----------
APP_REPOSITORIO="https://github.com/Elo-Fiap/elo-api-csharp.git"
APP_RAMO="main"
APP_PORTA="5080"                    # a API só escuta em 127.0.0.1; quem atende a rede é o Apache
APP_USUARIO="elo"                   # usuário de serviço, sem login
DIR_APP="/opt/elo-api"              # código baixado e aplicação publicada
DIR_DADOS="/var/lib/elo"            # banco SQLite
DIR_CONFIG="/etc/elo"               # variáveis de ambiente da aplicação e limites do monitor
DIR_LOG="/var/log/elo"              # logs de execução, auditoria, monitor e alertas

# ---------- Monitoramento ----------
INTERVALO_SEGUNDOS="15"             # de quanto em quanto tempo o monitor mede
LIMITE_CPU="80"                     # uso (%) a partir do qual sai alerta
LIMITE_MEMORIA="80"
LIMITE_DISCO="85"
REPETIR_ALERTA_MINUTOS="5"          # enquanto o problema durar, o alerta se repete nesse intervalo
SERVICOS_VIGIADOS="named apache2 elo-api"
REINICIAR_SERVICO_PARADO="sim"      # o monitor sobe de novo o serviço que encontrar parado
